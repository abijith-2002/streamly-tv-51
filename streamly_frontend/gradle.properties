# Project-wide Gradle settings
# Stabilized JVM args for CI/Docker environments. Limit metaspace, disable zip memory mapping
# to avoid IllegalArgumentException during packaging, and provide heap dump on OOM for diagnostics.
# Also disable memory mapped Zip to prevent file locking in Docker overlay FS.
org.gradle.jvmargs=-Xmx2048m -Xms512m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Dsun.zip.disableMemoryMapping=true -XX:+HeapDumpOnOutOfMemoryError

# Disable daemon explicitly (CI/Docker safe) and reduce concurrency to avoid file system contention.
# Even when Gradle prints "single-use daemon", we explicitly request non-daemon in CI runs too.
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.parallel=false

# Disable build cache to avoid stale/incomplete incremental artifacts such as zip-cache used by mergeJavaRes.
org.gradle.caching=false

# Extra safety: disable configuration cache which can interact badly with some Android tasks in CI.
org.gradle.unsafe.configuration-cache=false

# Verbose diagnostics in CI to capture full stacktraces if packaging fails.
org.gradle.logging.stacktrace=all
org.gradle.warning.mode=all

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official
# Also pass memory limits to Kotlin daemon to avoid container OOM thrashing.
kotlin.daemon.jvm.options=-Xmx1024m

# Enable AAPT2 (default in AGP 8+); kept for clarity in CI logs
android.enableAapt2=true

# Known resource merge stability toggles. These help avoid incremental merge flakiness in containers.
# Disable non-deterministic workers for AAPT packaging when needed.
android.nonTransitiveRClass=true
# Keep incremental transforms conservative in CI (AGP honors Gradle caching settings above).

# API Configuration
# Override these in local.properties or via environment variables
API_BASE_URL=https://api.streamly.example.com
USE_FAKE_DATA=false
